<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Confession Wall</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Anonymous Confession Wall</h1>
    <p id="confessionCounter">Total Confessions: 0</p>
    <textarea id="confessionInput" placeholder="Type your confession here..." rows="4" cols="50"></textarea>
    <button onclick="postConfession()">Post Confession</button>

    <div class="emoji-picker">
      <span class="emoji" onclick="addEmoji('😊')">😊</span>
      <span class="emoji" onclick="addEmoji('😂')">😂</span>
      <span class="emoji" onclick="addEmoji('😭')">😭</span>
      <span class="emoji" onclick="addEmoji('😎')">😎</span>
    </div>

    <div id="confessionsList"></div>
  </div>

  <audio id="backgroundMusic" autoplay loop>
    <source src="background-music.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script src="script.js"></script>
</body>
</html>
