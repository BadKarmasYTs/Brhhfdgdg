<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anonymous Confession Wall</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Anonymous Confession Wall</h1>
      <div id="confessionCounter">Total Confessions: 0</div>
    </div>

    <div class="user-input">
      <input type="text" id="nickname" placeholder="Enter your nickname (or stay Anonymous)">
      <select id="category">
        <option value="Funny">Funny</option>
        <option value="Embarrassing">Embarrassing</option>
        <option value="Deep Thoughts">Deep Thoughts</option>
      </select>
      <textarea id="confessionInput" rows="3" placeholder="What's on your mind?"></textarea>
      <div class="emoji-picker">
        <span class="emoji">😂</span>
        <span class="emoji">😳</span>
        <span class="emoji">😭</span>
        <span class="emoji">😈</span>
        <span class="emoji">🤔</span>
      </div>
      <button onclick="submitConfession()">Post Confession</button>
      <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>

    <div id="confessionsList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
